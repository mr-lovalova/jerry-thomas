sample:
  rounding: ceil
  cadence: 1h

features:
  - id: onshore_mwh_scaled
    stream: metrics.production.wind
    field: value
    scale: true
  - id: onshore_mwh_window
    stream: metrics.production.wind
    field: value
    sequence:
      size: 2
      stride: 2

targets:
  - id: dk1_price
    stream: targets.price.dk1
    field: value
    horizon: 0s

postprocess:
  features:
    threshold: 0.3
