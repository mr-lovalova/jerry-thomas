[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jerry-thomas"
version = "9.0.0"
description = "A stream-first temporal data pipeline runtime"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anders Skott Lind" }]
urls = { "Homepage" = "https://github.com/mr-lovalova/datapipeline", "Repository" = "https://github.com/mr-lovalova/datapipeline", "Issues" = "https://github.com/mr-lovalova/datapipeline/issues" }
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=5.4",
  "jinja2>=3.0",
  "rich>=13",
  "tomlkit>=0.13",
]

[project.optional-dependencies]
# Bounded numerical batches from jerrythomas.integrations.ml
ml = [
  "numpy>=1.26",
]
# NumPy-backed ordered statistical transforms
numerical = ["numpy>=1.26"]
parquet = ["pyarrow>=14"]
test = ["numpy>=1.26", "pytest>=8.0", "pyarrow>=14"]
mutation = ["mutmut>=3.5,<4"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "numpy>=1.26",
  "pytest>=8.0",
  "pyarrow>=14",
  "ruff>=0.16,<0.17",
  "types-PyYAML>=6.0",
]

[project.scripts]
jerry = "jerrythomas.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["jerrythomas.templates*"]

[tool.setuptools.package-data]
jerrythomas = [
  "templates/plugin_skeleton/**",
  "templates/plugin_skeleton/.gitignore",
  "templates/dataset_skeleton/**",
  "templates/dataset_skeleton/your-dataset/.env.example",
  "templates/demo_skeleton/**",
  "templates/demo_skeleton/demo/.env.example",
  "templates/stubs/**"
]

[tool.setuptools.exclude-package-data]
jerrythomas = [
  "templates/**/.DS_Store",
  "templates/**/*.pyc",
  "templates/**/*.pyo",
  "templates/**/__pycache__/*",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/jerrythomas/templates"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/jerrythomas"]
exclude = ["^src/jerrythomas/templates/"]
check_untyped_defs = true

[project.entry-points."jerrythomas.mappers"]
encode_time = "jerrythomas.mappers.synthetic.time:encode"
identity = "jerrythomas.mappers.noop:identity"

[project.entry-points."jerrythomas.loaders"]
"core.synthetic.ticks" = "jerrythomas.sources.synthetic.time.loader:make_time_loader"

[project.entry-points."jerrythomas.parsers"]
identity = "jerrythomas.parsers.identity:IdentityParser"
"core.temporal_record" = "jerrythomas.parsers.temporal_record:TemporalRecordParser"

[project.entry-points."jerrythomas.operations.build"]
"core.artifact.series" = "jerrythomas.operations.artifacts.series:build_series_artifact"
"core.artifact.metadata" = "jerrythomas.operations.artifacts.metadata:build_metadata_artifact"
"core.artifact.scaler" = "jerrythomas.operations.artifacts.scaler:build_scaler_artifact"
"core.artifact.coverage_stats" = "jerrythomas.operations.artifacts.coverage_stats:build_coverage_stats_artifact"
"core.artifact.schedule" = "jerrythomas.operations.artifacts.schedule:build_schedule_artifact"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/jerrythomas/"]
only_mutate = [
  "src/jerrythomas/alignment/as_of.py",
  "src/jerrythomas/alignment/broadcast.py",
  "src/jerrythomas/alignment/broadcast_as_of.py",
  "src/jerrythomas/alignment/engine.py",
  "src/jerrythomas/domain/value.py",
  "src/jerrythomas/operations/artifacts/utils.py",
  "src/jerrythomas/pipelines/dataset/split.py",
  "src/jerrythomas/pipelines/series/projector.py",
  "src/jerrythomas/pipelines/sort.py",
  "src/jerrythomas/pipelines/sample/keys.py",
  "src/jerrythomas/transforms/stream/rolling_ols.py",
  "src/jerrythomas/transforms/rolling_slope.py",
  "src/jerrythomas/transforms/stream/forward_sum.py",
  "src/jerrythomas/transforms/stream/logarithm.py",
  "src/jerrythomas/transforms/vector/conform.py",
  "src/jerrythomas/transforms/vector/scaler.py",
]
pytest_add_cli_args = ["-q", "-W", "error"]
pytest_add_cli_args_test_selection = [
  "tests/unit/alignment/",
  "tests/unit/artifact_build/",
  "tests/unit/io/",
  "tests/unit/pipeline/",
  "tests/unit/transforms/",
  "tests/integration/",
]
mutate_only_covered_lines = true
