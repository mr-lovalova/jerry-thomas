id: equity.ohlcv
from:
  source: sandbox.ohlcv
map:
  entrypoint: map_sandbox_ohlcv_dto_to_equity
  args: {}

partition_by: [ticker]

preprocess:
  - { operation: where, field: time, operator: ge, comparand: "${start_time}" }
  - { operation: where, field: time, operator: lt, comparand: "${end_time}" }

transforms:
  - operation: dedupe
  - operation: resample
    period: { kind: fixed, every: "${cadence}" }
    start: "${start_time}"
    end: "${end_time}"
    aggregations:
      open: { field: open, statistic: first }
      high: { field: high, statistic: max }
      low: { field: low, statistic: min }
      close: { field: close, statistic: last }
      volume: { field: volume, statistic: sum }
      dollar_volume: { field: dollar_volume, statistic: sum }
  - { operation: derive, left: high, operator: sub, right_field: low, to: hl_range }
  - operation: rolling # compute average dollar volume over 5 daily periods
    field: dollar_volume
    to: adv5
    window: 5
    statistic: mean
    min_samples: 1
  - { operation: where, field: adv5, operator: ne, comparand: null }
  - { operation: where, field: adv5, operator: ge, comparand: 1_000_000 } # keep liquid stocks
#   - { operation: fill, field: close, statistic: median, window: 6, min_samples: 1 }
#   - { operation: forward_fill, field: close, to: close_asof }
