id: equity.msft
from:
  source: sandbox.ohlcv
map:
  entrypoint: map_sandbox_ohlcv_dto_to_equity
  args: {}

partition_by: [ticker]

preprocess:
  - { operation: where, field: time, operator: ge, comparand: "${start_time}" }
  - { operation: where, field: time, operator: lt, comparand: "${end_time}" }
  - { operation: where, field: ticker, operator: eq, comparand: "MSFT" }

transforms:
  - operation: dedupe
  - operation: resample
    period: { kind: fixed, every: "${cadence}" }
    start: "${start_time}"
    end: "${end_time}"
    aggregations:
      open: { field: open, statistic: first }
      high: { field: high, statistic: max }
      low: { field: low, statistic: min }
      close: { field: close, statistic: last }
      volume: { field: volume, statistic: sum }
      dollar_volume: { field: dollar_volume, statistic: sum }
  - { operation: derive, left: high, operator: sub, right_field: low, to: hl_range }
  - operation: rolling
    field: dollar_volume
    to: adv5
    window: 5
    statistic: mean
    min_samples: 3
