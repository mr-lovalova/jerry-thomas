[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{DIST_NAME}}"
version = "0.0.1"
description = "A Jerry Thomas plugin for the {{DIST_NAME}} domain"
dependencies = [
  "jerry-thomas>=11.0.0",
]

[project.entry-points."jerrythomas.combiners"]
